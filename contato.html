<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portal de Serviços Digitais</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Portal de Serviços Digitais</h1>
        <p>Informação e serviços em um só lugar.</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section>
            <h2>Entre em contato</h2>
            
            <!-- IMAGEM ATUALIZADA (Opção 1 - Ilustração) -->
           <img src="https://cdn-icons-png.flaticon.com/512/3176/3176366.png" alt="Ícone de contato por e-mail" style="width: 120px; display: block; margin: 0 auto 20px;">
            <p>Preencha os campos abaixo. Nesta etapa, o formulário ainda não enviará os dados para um servidor.</p>

            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione</option>
                    <option value="duvida">Dúvida</option>
                    <option value="solicitacao">Solicitação</option>
                    <option value="sugestao">Sugestão</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Programação Web</p>
    </footer>
</body>
</html>
